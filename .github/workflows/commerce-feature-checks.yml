name: Commerce feature checks

on:
  pull_request:
    branches: [main, feat/seller-route-auth-redesign, feat/commerce-complete-workflows]
  push:
    branches: [feat/end-to-end-hybrid-optimization, feat/commerce-complete-workflows, feat/provider-supply-settlement-workflows, feat/unified-role-dashboards-tailwind]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --no-save
      - run: bun run lint
      - run: bun run test:logistics
      - run: bun run test:hybrid
      - run: bun run test:privacy
      - run: bun run test:roles
      - run: bun run build
      - run: bun run build:workspace
