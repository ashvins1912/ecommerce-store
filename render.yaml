services:
  - type: web
    name: ecommerce-api
    runtime: node
    plan: free
    buildCommand: bun install --no-save && bun run lint && bun run test && cd api && bun run build
    startCommand: cd api && NODE_OPTIONS="--max-old-space-size=384" bun run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISABLE_STATIC_UI
        value: "1"
      - key: SHIPROCKET_API_BASE_URL
        value: https://apiv2.shiprocket.in
      - key: SHADOWFAX_API_BASE_URL
        value: https://dale.shadowfax.in/api
      - key: ROOT_SUPERUSER_EMAIL
        value: ashvinsingh25@gmail.com
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ROOT_SUPERUSER_INITIAL_PASSWORD
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOGISTICS_SUPABASE_URL
        sync: false
      - key: LOGISTICS_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_CDN_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PAYMENT_SERVICE_URL
        sync: false
      - key: SHIPPING_SERVICE_URL
        sync: false
      - key: SERVICE_INTERNAL_SECRET
        sync: false

  - type: web
    name: ecommerce-ui
    runtime: static
    plan: free
    buildCommand: bun install --no-save && cd customer-web && bun run build
    staticPublishPath: ./dist/customer-web
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ASSET_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: ecommerce-provider-portal
    runtime: static
    plan: free
    buildCommand: bun install --no-save && cd provider-portal && bun run build
    staticPublishPath: ./dist/provider-portal
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
